<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1976D2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="题库搜题" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>题库搜题</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="global-error" style="display:none;position:fixed;top:0;left:0;right:0;background:#ffebee;color:#c62828;padding:12px;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;word-break:break-all;max-height:50vh;overflow:auto;border-bottom:2px solid #c62828;"></div>
    <script>
      window.onerror = function(msg, url, line, col, err) {
        var el = document.getElementById('global-error');
        el.style.display = 'block';
        el.textContent = 'JS Error: ' + msg + '\nFile: ' + url + '\nLine: ' + line + ':' + col + '\nStack: ' + (err && err.stack ? err.stack : 'none');
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('global-error');
        el.style.display = 'block';
        el.textContent = 'Promise Rejection: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + '\nStack: ' + (e.reason && e.reason.stack ? e.reason.stack : 'none');
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
